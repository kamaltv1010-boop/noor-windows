# Builds Noor for Windows: a portable .exe and an installer. Every build
# of main becomes a release (v1.0.<run number>) with both files attached,
# so every version stays available and can be gone back to; a pushed tag
# like v1.2.0 makes a release of that version. Nothing is code-signed, so
# Windows SmartScreen asks once before the first run ("More info" > "Run
# anyway").
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      # Every build has its own version, shown in the ⋯ menu, in Settings >
      # About and in the file names: 1.0.<run number>, or the tag's version
      # for a release (v1.2.0 -> 1.2.0).
      - name: Version this build
        shell: bash
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            version="${GITHUB_REF#refs/tags/v}"
          else
            base="$(node -p "require('./package.json').version.split('.').slice(0, 2).join('.')")"
            version="$base.$GITHUB_RUN_NUMBER"
          fi
          npm version "$version" --no-git-tag-version --allow-same-version
          echo "NOOR_VERSION=$version" >> "$GITHUB_ENV"
          echo "Building Noor $version"
          # The release's description, in Arabic (CLAUDE.md): what this
          # build fixes and changes, from its own section of CHANGELOG.md, or
          # "Unreleased" until the version has one; then how to download.
          section() { awk -v h="## $1" '$0 == h { on = 1; next } on && /^## / { exit } on' CHANGELOG.md; }
          changes="$(section "$version")"
          if [ -z "$(printf '%s' "$changes" | tr -d '[:space:]')" ]; then changes="$(section "Unreleased")"; fi
          {
            echo "## نور $version"
            echo
            echo "### ما الذي أُصلح وتغيّر في هذه النسخة"
            echo
            if [ -n "$(printf '%s' "$changes" | tr -d '[:space:]')" ]; then printf '%s\n' "$changes"; else git log -1 --pretty=%B; fi
            echo
            echo "### التحميل"
            echo
            echo "- **Noor** (متصفح Windows): ملف \`Noor-$version-windows-x64-portable.exe\` يعمل بدون تثبيت، وملف \`Noor-Setup-$version-windows-x64.exe\` يثبّت البرنامج."
            echo "- **Noor iPhone**: ملفات \`Noor-iPhone-…\`: نفس المتصفح بواجهة iPhone وiPad، وبروفايلاته وبياناته منفصلة عن Noor."
            echo "- **Noor Android**: ملفات \`Noor-Android-…\`: نفس المتصفح بواجهة هاتف أو تابلت Android، وبروفايلاته وبياناته منفصلة أيضاً."
            echo
            echo "يعمل على Windows 10 و11 (64-bit). عند أول تشغيل قد يسأل SmartScreen مرة واحدة: اضغط More info ثم Run anyway."
            echo
            echo "الـ commit: \`${GITHUB_SHA::7}\`"
          } > release-notes.md

      - name: Build the .exe
        run: npm run dist

      # The fuses electron-builder flips in each built app (package.json,
      # build.electronFuses): cookies encrypted on the disk, as Chrome keeps
      # them, and no way into the app's main process for another program
      # (tools/check-fuses.js reads them from the .exe itself).
      - name: Check Noor's fuses
        shell: bash
        run: node tools/check-fuses.js "dist/win-unpacked/Noor.exe"

      # Noor iPhone: the same app as an app of its own, in which every
      # profile is an iPhone to sites (see main/iphone.js).
      - name: Build Noor iPhone
        run: npm run dist:iphone

      - name: Check Noor iPhone's fuses
        shell: bash
        run: node tools/check-fuses.js "dist/win-unpacked/Noor iPhone.exe"

      # Noor Android: the same app as an app of its own, in which every
      # profile is an Android phone or tablet to sites (see main/android.js).
      - name: Build Noor Android
        run: npm run dist:android

      - name: Check Noor Android's fuses
        shell: bash
        run: node tools/check-fuses.js "dist/win-unpacked/Noor Android.exe"

      - name: Keep the .exe
        uses: actions/upload-artifact@v4
        with:
          name: Noor-windows-${{ env.NOOR_VERSION }}
          path: dist/*.exe
          if-no-files-found: error

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ env.NOOR_VERSION }}
          name: Noor ${{ env.NOOR_VERSION }}
          target_commitish: ${{ github.sha }}
          body_path: release-notes.md
          files: dist/*.exe
          fail_on_unmatched_files: true
