# Builds Noor for Windows: a portable .exe and an installer, as artifacts
# of every run, and attached to the release when a tag like v1.0.0 is
# pushed. Nothing is code-signed, so Windows SmartScreen asks once before
# the first run ("More info" > "Run anyway").
name: Build

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install
        run: npm ci

      - name: Test
        run: npm test

      - name: Build the .exe
        run: npm run dist

      - name: Keep the .exe
        uses: actions/upload-artifact@v4
        with:
          name: Noor-windows
          path: dist/*.exe
          if-no-files-found: error

      - name: Attach to the release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist/*.exe
