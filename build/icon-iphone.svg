<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Noor iPhone: Noor's star on an iPhone (its Dynamic Island), on blue. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#061433"/>
      <stop offset="0.5" stop-color="#0A5BD6"/>
      <stop offset="1" stop-color="#32B6FF"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D6E8FF"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA45D"/>
      <stop offset="1" stop-color="#F96C5F"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#00112E" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <ellipse cx="128" cy="134" rx="108" ry="34" transform="rotate(-24 128 134)" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2.5"/>
  <rect x="80" y="34" width="96" height="190" rx="26" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="80" y="34" width="96" height="190" rx="26" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2"/>
  <rect x="111" y="45" width="34" height="11" rx="5.5" fill="#0B1424"/>
  <path d="M128 96 Q132.5 124.5 160 129 Q132.5 133.5 128 162 Q123.5 133.5 96 129 Q123.5 124.5 128 96 Z" fill="#FF8A5C" opacity="0.55" filter="url(#glow)"/>
  <path d="M128 96 Q132.5 124.5 160 129 Q132.5 133.5 128 162 Q123.5 133.5 96 129 Q123.5 124.5 128 96 Z" fill="url(#star)"/>
  <circle cx="128" cy="129" r="4.5" fill="#FFF6E8"/>
  <rect x="112" y="210" width="32" height="4" rx="2" fill="#0B1424" opacity="0.35"/>
</svg>
