<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 256 256">
  <!-- Noor Android: Noor's star on an Android phone (its camera hole), on green. -->
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#04291A"/>
      <stop offset="0.5" stop-color="#0B8A4E"/>
      <stop offset="1" stop-color="#3DDC84"/>
    </linearGradient>
    <linearGradient id="body" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFFFFF"/>
      <stop offset="1" stop-color="#D3F5E2"/>
    </linearGradient>
    <linearGradient id="star" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FFA45D"/>
      <stop offset="1" stop-color="#F96C5F"/>
    </linearGradient>
    <filter id="shadow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="6" stdDeviation="8" flood-color="#002A14" flood-opacity="0.45"/>
    </filter>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6"/>
    </filter>
  </defs>
  <rect width="256" height="256" rx="56" fill="url(#bg)"/>
  <ellipse cx="128" cy="134" rx="108" ry="34" transform="rotate(24 128 134)" fill="none" stroke="#FFFFFF" stroke-opacity="0.2" stroke-width="2.5"/>
  <rect x="78" y="36" width="100" height="186" rx="16" fill="url(#body)" filter="url(#shadow)"/>
  <rect x="78" y="36" width="100" height="186" rx="16" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="2"/>
  <circle cx="128" cy="50" r="5.5" fill="#0A1A12"/>
  <rect x="180" y="84" width="4" height="26" rx="2" fill="#FFFFFF" opacity="0.85"/>
  <path d="M128 96 Q132.5 124.5 160 129 Q132.5 133.5 128 162 Q123.5 133.5 96 129 Q123.5 124.5 128 96 Z" fill="#FF8A5C" opacity="0.55" filter="url(#glow)"/>
  <path d="M128 96 Q132.5 124.5 160 129 Q132.5 133.5 128 162 Q123.5 133.5 96 129 Q123.5 124.5 128 96 Z" fill="url(#star)"/>
  <circle cx="128" cy="129" r="4.5" fill="#FFF6E8"/>
  <rect x="110" y="208" width="36" height="4" rx="2" fill="#0A1A12" opacity="0.35"/>
</svg>
